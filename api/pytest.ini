[pytest]
testpaths = tests
addopts = -q -p no:cacheprovider
timeout = 900
markers =
    mssql: needs the LocalDB SQL Server instance (skipped when unreachable)
    ollama: needs the local Ollama server (skipped when unreachable)
    slow: long-running evaluation-style test
filterwarnings =
    ignore::DeprecationWarning
    ignore::UserWarning
